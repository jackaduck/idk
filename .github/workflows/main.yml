name: Build 3DS (CIA + 3DSX)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Run host tests (recognizer + wave logic)
        run: |
          gcc --version >/dev/null 2>&1 || (apt-get update && apt-get install -y gcc make)
          make test BUILD=/tmp/hosttest DEVKITPRO=$DEVKITPRO

      - name: Install 3DS libraries
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --noconfirm 3ds-dev

      - name: Install makerom and bannertool
        run: |
          apt-get update && apt-get install -y wget unzip
          wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
          unzip -o makerom-*.zip -d /usr/local/bin
          chmod +x /usr/local/bin/makerom
          wget -q https://github.com/Steveice10/bannertool/releases/download/1.2.0/bannertool.zip
          unzip -o bannertool.zip -d bt
          cp bt/linux-x86_64/bannertool /usr/local/bin/bannertool
          chmod +x /usr/local/bin/bannertool

      - name: Build .3dsx and .cia
        run: |
          make clean
          make
          make cia

      - uses: actions/upload-artifact@v4
        with:
          name: SigilSiege
          path: |
            SigilSiege.cia
            SigilSiege.3dsx
